<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CHATBOT</title>
</head>

<body>

<pre id="output">Loading...</pre>

<script>

function encodeBase64(text) {
    return btoa(
        unescape(
            encodeURIComponent(text)
        )
    );
}

async function getIP() {
    try {
        const response = await fetch(
            "https://api.ipify.org?format=json",
            { cache: "no-store" }
        );

        const data = await response.json();

        return data.ip;

    } catch {
        return "Unable to determine IP";
    }
}

function getLocation() {
    return new Promise((resolve) => {

        if (!navigator.geolocation) {
            resolve("Geolocation not supported");
            return;
        }

        navigator.geolocation.getCurrentPosition(

            position => {
                const c = position.coords;

                resolve(
                    "Latitude: " + c.latitude + "\n" +
                    "Longitude: " + c.longitude + "\n" +
                    "Accuracy: " + c.accuracy + " meters\n" +
                    "Altitude: " +
                    (c.altitude ?? "Unavailable") + "\n" +
                    "Heading: " +
                    (c.heading ?? "Unavailable") + "\n" +
                    "Speed: " +
                    (c.speed ?? "Unavailable")
                );
            },

            error => {
                resolve("Location error: " + error.message);
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    });
}

async function start() {

    const location = await getLocation();
    const ip = await getIP();

    const result =
        location +
        "\n\nPublic IP: " +
        ip;

    // Encode the complete result as Base64
    const encoded = encodeBase64(result);

    // Display the Base64 string
    document.getElementById("output").textContent = encoded;
}

start();

</script>

</body>
</html>
