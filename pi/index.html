<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location & IP</title>
</head>

<body>

    <div id="location">
        Requesting location...
    </div>

    <div id="ip">
        Detecting IP address...
    </div>

    <script>

        // Get browser location automatically
        function getLocation() {

            const output = document.getElementById("location");

            if (!navigator.geolocation) {
                output.textContent =
                    "Location: Geolocation is not supported by this browser.";
                return;
            }

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const coords = position.coords;

                    output.textContent =
                        "Latitude: " + coords.latitude + "\n" +
                        "Longitude: " + coords.longitude + "\n" +
                        "Accuracy: " + coords.accuracy + " meters\n" +
                        "Altitude: " +
                        (coords.altitude !== null
                            ? coords.altitude + " meters"
                            : "Unavailable") + "\n" +
                        "Heading: " +
                        (coords.heading !== null
                            ? coords.heading + "°"
                            : "Unavailable") + "\n" +
                        "Speed: " +
                        (coords.speed !== null
                            ? coords.speed + " m/s"
                            : "Unavailable") + "\n" +
                        "Timestamp: " +
                        new Date(position.timestamp).toString();

                },

                function(error) {

                    let message;

                    switch (error.code) {

                        case error.PERMISSION_DENIED:
                            message = "Location permission denied.";
                            break;

                        case error.POSITION_UNAVAILABLE:
                            message = "Location unavailable.";
                            break;

                        case error.TIMEOUT:
                            message = "Location request timed out.";
                            break;

                        default:
                            message = "Unknown location error.";
                    }

                    output.textContent =
                        "Location: " + message;
                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }


        // Get public IP automatically
        async function getIP() {

            const output = document.getElementById("ip");

            try {

                const response = await fetch(
                    "https://api.ipify.org?format=json",
                    {
                        cache: "no-store"
                    }
                );

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();

                output.textContent =
                    "Public IP: " + data.ip;

            } catch (error) {

                output.textContent =
                    "Public IP: Unable to determine IP address.";
            }
        }


        // Run automatically when the page loads
        window.addEventListener("load", function() {
            getLocation();
            getIP();
        });

    </script>

</body>
</html>
